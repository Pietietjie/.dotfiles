# Tokyonight port of zsh/pietietjie.zsh-theme

add_newline = true
command_timeout = 500
scan_timeout = 30

format = """
$status\
[󰌽 ](#7aa2f7)\
$username\
$hostname\
$directory\
(‹$php${custom.sep_node}$nodejs${custom.sep_py}$python› )\
(‹$shell$nix_shell$direnv› )\
$cmd_duration\
$time\
$line_break\
$character\
$git_branch\
$git_status\
${custom.nogit} [:](#bb9af7) """

# Line 1

[status]
disabled = false
format = '[$symbol]($style)  '
symbol = '󰻌'
success_symbol = '󰳉'
success_style = '#9ece6a'
failure_style = '#ff8787'
map_symbol = false
pipestatus = false

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold #7aa2f7'
style_root = 'bold #db4b4b'

[hostname]
ssh_only = false
trim_at = '.'
format = '[@$hostname]($style)[:](#ff9e64)'
style = 'bold #7aa2f7'

[directory]
truncation_length = 0
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style) '
style = '#9ece6a'
read_only = ' 🔒'
read_only_style = '#ff8787'

[php]
format = '([ v$version]($style))'
version_format = '${major}.${minor}'
style = '#bb9af7'
detect_files = ['composer.json', 'composer.lock', '.php-version', 'phpunit.xml', 'phpunit.xml.dist', 'phpcs.xml', 'phpstan.neon', 'psalm.xml', 'codeception.yml', 'artisan', '.envrc']

[nodejs]
format = '([ v$version]($style))'
version_format = '${major}.${minor}'
style = '#bb9af7'

[python]
format = '([ v$version( $virtualenv)]($style))'
version_format = '${major}.${minor}'
style = '#bb9af7'

[shell]
disabled = false
format = '[ $indicator]($style)'
style = '#7dcfff'
bash_indicator = 'bash'
zsh_indicator = 'zsh'
fish_indicator = 'fish'
powershell_indicator = 'pwsh'
nu_indicator = 'nu'
elvish_indicator = 'elvish'
tcsh_indicator = 'tcsh'
xonsh_indicator = 'xonsh'
cmd_indicator = 'cmd'
ion_indicator = 'ion'
unknown_indicator = 'sh'

[nix_shell]
disabled = false
heuristic = false
format = '[/ $state]($style)'
style = '#7dcfff'
impure_msg = '󱐋'
pure_msg = '󰘧'

[direnv]
disabled = false
format = '[/direnv $loaded]($style)'
style = '#7dcfff'
loaded_msg = ' '
unloaded_msg = ' '
allowed_msg = ''
not_allowed_msg = ''
denied_msg = 'denied'

[cmd_duration]
min_time = 2000
format = '[‹$duration›]($style) '
style = '#ff9e64'

[time]
disabled = false
time_format = '%T'
format = '[  $time]($style)'
style = '#ff8787'

# Line 2

[character]
success_symbol = '[╰─](#9ece6a) '
error_symbol = '[╰─](#ff8787) '
vimcmd_symbol = '[╰─](#bb9af7) '

[git_branch]
format = '[$symbol$branch]($style)'
symbol = ' '
style = '#bb9af7'
truncation_symbol = '…'

[git_status]
format = '([$index_added$index_modified$index_deleted$renamed](#9ece6a))([$worktree_modified$worktree_deleted](#ffaf5f))([$untracked](#7aa2f7))([$conflicted](bold #ff8787))([$stashed](#bb9af7))([$ahead_behind](#7aa2f7))'
index_added = ' +${count}'
index_modified = ' ~${count}'
index_deleted = ' -${count}'
renamed = ' »${count}'
worktree_modified = ' !${count}'
worktree_deleted = ' ✘${count}'
untracked = ' ?${count}'
conflicted = ' =${count}'
stashed = '  ${count}'
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
diverged = ' ⇡${ahead_count}⇣${behind_count}'
up_to_date = ''

[custom.nogit]
description = 'branch placeholder outside a git repo'
when = '! git rev-parse --is-inside-work-tree > /dev/null 2>&1'
command = 'true'
format = '[ ](#ff8787)'
shell = ['sh']

[custom.sep_node]
description = 'slash between the php and node versions'
when = '( command -v php >/dev/null 2>&1 && ( [ -e composer.json ] || [ -e composer.lock ] || [ -e .php-version ] || [ -e phpunit.xml ] || [ -e phpunit.xml.dist ] || [ -e phpcs.xml ] || [ -e phpstan.neon ] || [ -e psalm.xml ] || [ -e codeception.yml ] || [ -e artisan ] || [ -e .envrc ] || ls *.php >/dev/null 2>&1 ) ) && ( command -v node >/dev/null 2>&1 && ( [ -e package.json ] || [ -e .node-version ] || [ -e .nvmrc ] || [ -d node_modules ] || ls *.js >/dev/null 2>&1 || ls *.mjs >/dev/null 2>&1 || ls *.cjs >/dev/null 2>&1 || ls *.ts >/dev/null 2>&1 || ls *.mts >/dev/null 2>&1 || ls *.cts >/dev/null 2>&1 ) )'
command = 'true'
format = '[/]($style)'
style = '#bb9af7'
shell = ['sh']

[custom.sep_py]
description = 'slash before the python version'
when = '( ( command -v php >/dev/null 2>&1 && ( [ -e composer.json ] || [ -e composer.lock ] || [ -e .php-version ] || [ -e phpunit.xml ] || [ -e phpunit.xml.dist ] || [ -e phpcs.xml ] || [ -e phpstan.neon ] || [ -e psalm.xml ] || [ -e codeception.yml ] || [ -e artisan ] || [ -e .envrc ] || ls *.php >/dev/null 2>&1 ) ) || ( command -v node >/dev/null 2>&1 && ( [ -e package.json ] || [ -e .node-version ] || [ -e .nvmrc ] || [ -d node_modules ] || ls *.js >/dev/null 2>&1 || ls *.mjs >/dev/null 2>&1 || ls *.cjs >/dev/null 2>&1 || ls *.ts >/dev/null 2>&1 || ls *.mts >/dev/null 2>&1 || ls *.cts >/dev/null 2>&1 ) ) ) && ( ( command -v python3 >/dev/null 2>&1 || command -v python >/dev/null 2>&1 ) && ( [ -e .python-version ] || [ -e Pipfile ] || [ -e __init__.py ] || [ -e pyproject.toml ] || [ -e requirements.txt ] || [ -e setup.py ] || [ -e tox.ini ] || ls *.py >/dev/null 2>&1 || ls *.ipynb >/dev/null 2>&1 ) )'
command = 'true'
format = '[/]($style)'
style = '#bb9af7'
shell = ['sh']
