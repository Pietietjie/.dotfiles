# Tokyonight port of zsh/pietietjie.zsh-theme

add_newline = true
command_timeout = 500
scan_timeout = 30

format = """
$status\
[🐧](#7aa2f7)\
$username\
$hostname\
$directory\
$php\
$nodejs\
$python\
$nix_shell\
$direnv\
$cmd_duration\
$time\
$line_break\
$character\
$git_branch\
$git_status\
${custom.nogit} [:](#bb9af7) """

# Line 1

[status]
disabled = false
format = '[$symbol]($style)  '
symbol = '󰻌'
success_symbol = '󰳉'
success_style = '#9ece6a'
failure_style = '#ff8787'
map_symbol = false
pipestatus = false

[username]
show_always = true
format = '[$user]($style)'
style_user = 'bold #7aa2f7'
style_root = 'bold #db4b4b'

[hostname]
ssh_only = false
trim_at = '.'
format = '[@$hostname]($style)[:](#ff9e64)'
style = 'bold #7aa2f7'

[directory]
truncation_length = 0
truncate_to_repo = false
format = '[$path]($style)[$read_only]($read_only_style) '
style = '#9ece6a'
read_only = ' 🔒'
read_only_style = '#ff8787'

[php]
format = '[‹ $version›]($style) '
version_format = '${raw}'
style = '#bb9af7'

[nodejs]
format = '[‹ $version›]($style) '
version_format = 'v${raw}'
style = '#bb9af7'

[python]
format = '[‹py $version( $virtualenv)›]($style) '
version_format = '${raw}'
style = '#bb9af7'

[nix_shell]
disabled = false
heuristic = false
format = '[‹nix $state( $name)›]($style) '
style = '#7dcfff'
impure_msg = 'impure'
pure_msg = 'pure'

[direnv]
disabled = false
format = '[‹direnv $loaded›]($style) '
style = '#7dcfff'
loaded_msg = 'on'
unloaded_msg = 'off'
allowed_msg = ''
not_allowed_msg = ''
denied_msg = 'denied'

[cmd_duration]
min_time = 2000
format = '[‹$duration›]($style) '
style = '#ff9e64'

[time]
disabled = false
time_format = '%T'
format = '[  $time]($style)'
style = '#ff8787'

# Line 2

[character]
success_symbol = '[╰─](#9ece6a) '
error_symbol = '[╰─](#ff8787) '
vimcmd_symbol = '[╰─](#bb9af7) '

[git_branch]
format = '[$symbol$branch]($style)'
symbol = ' '
style = '#bb9af7'
truncation_symbol = '…'

[git_status]
format = '[$conflicted$staged$modified$renamed$deleted]($style)[$untracked](#9ece6a)[$stashed](#bb9af7)[$ahead_behind](#7aa2f7)'
style = '#ffaf5f'
conflicted = ' ='
staged = ' +'
modified = ' '
renamed = ' »'
deleted = ' ✘'
typechanged = ''
untracked = ' ?'
stashed = ' \$'
ahead = ' ⇡${count}'
behind = ' ⇣${count}'
diverged = ' ⇡${ahead_count}⇣${behind_count}'

[custom.nogit]
description = 'branch placeholder outside a git repo'
when = '! git rev-parse --is-inside-work-tree > /dev/null 2>&1'
command = 'true'
format = '[ ](#ff8787)'
shell = ['sh']
